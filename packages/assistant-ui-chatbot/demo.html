<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant UI Chatbot Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    
    #chatbot-container {
      width: 100%;
      max-width: 600px;
      height: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #e0f2fe;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
    }

    .info h3 {
      color: #0369a1;
      margin-bottom: 10px;
    }

    .info ul {
      margin-left: 20px;
      color: #0c4a6e;
    }

    .info li {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <h1>🤖 Assistant UI Chatbot Demo</h1>
  
  <div id="chatbot-container"></div>

  <div class="info">
    <h3>About this Demo</h3>
    <ul>
      <li>Built with <strong>@assistant-ui/react v0.11.51</strong> (latest)</li>
      <li>Using <strong>React 19</strong></li>
      <li>Bundled with <strong>Vite</strong></li>
      <li>Features a basic echo chatbot adapter</li>
    </ul>
  </div>

  <script type="module">
    // For dev server (yarn dev:server), import from source for HMR
    // For production preview, import from dist
    const isDev = import.meta.env?.DEV ?? !window.location.protocol.startsWith('file');
    
    async function init() {
      let mount;
      try {
        // Try importing from source (works with Vite dev server)
        const module = await import('./src/index.ts');
        mount = module.mount;
      } catch {
        // Fallback to dist (works with static serving or yarn serve)
        const module = await import('./dist/index.js');
        mount = module.mount;
      }
      
      const container = document.getElementById('chatbot-container');
      const unmount = mount(container);
      
      // Optional: unmount when needed
      // window.unmountChatbot = unmount;
    }
    
    init();
  </script>
</body>
</html>
